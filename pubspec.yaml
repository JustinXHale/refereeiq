name: refereeiq
description: >
  RefereeIQ is your pocket-sized rugby referee coach.
  Test your knowledge daily with bite-sized challenges,
  review complex laws and scenarios, track your score
  and ranking, and compare with fellow referees on the
  integrated leaderboard. Perfect for referees, coaches,
  players, and fans who want to deepen their understanding
  of the game’s laws with interactive quizzes and video
  analysis.
publish_to: 'none'
version: 0.6.1+1

environment:
  sdk: '>=3.8.1 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  google_fonts: ^6.1.0
  intl: ^0.18.1
  http: ^1.2.1
  flutter_dotenv: ^5.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.10.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/sofia.png
    - assets/icons/google_icon.png
    - assets/icons/app_icon.png
    - .env

# flutter_launcher_icons configuration must be at the root level:
flutter_icons:
  android: true
  ios: true
  image_path: "assets/icons/app_icon.png"
